spring:
  application:
    name: mysquad-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:aws-0-ap-southeast-1.pooler.supabase.com}:${DB_PORT:6543}/${DB_NAME:postgres}?sslmode=require&prepareThreshold=0
    username: ${DB_USER:postgres.vzumejeuvggbyqleasjs}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-init-sql: SELECT 1
      connection-timeout: 30000
    properties:
      ssl: true
      sslmode: require
      sslfactory: org.postgresql.ssl.DefaultJavaSSLFactory

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.mysquad: DEBUG
    org.springframework.security: INFO
