services:
  - type: web
    name: mysquad-backend
    runtime: docker
    repo: https://github.com/Rakesh-Reddy-K/mysquad
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVER_PORT
        value: 8080
      - key: DB_HOST
        value: db.vzumejeuvggbyqleasjs.supabase.co
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        value: postgres
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://mysquad-frontend-xok9.onrender.com,http://localhost:80,http://localhost:5173

  - type: web
    name: mysquad-frontend
    runtime: docker
    repo: https://github.com/Rakesh-Reddy-K/mysquad
    rootDir: frontend
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: VITE_API_URL
        value: https://mysquad-backend-s0aq.onrender.com/api
